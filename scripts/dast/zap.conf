# why:
#   ZAP の各スクリプトに渡す Rule Configuration。
#   形式: <pluginId>\t<IGNORE|WARN|FAIL>\t(理由)
#
#   運用方針:
#     「根拠が説明できるものだけ IGNORE する」。IGNORE は警告を消すだけで
#     スキャン自体は行うが、本当に脆弱な実装が混入しても気づけなくなるため、
#     初回スキャンでは極力 IGNORE を増やさず、triage 結果を根拠付きで追記する。

#   40018  SQL Injection
#     newcleus は DynamoDB のみで SQL を一切組み立てない。ZAP の Boolean-based
#     SQLi 検出は「クエリ値が HTML/JSON に反射した際のレスポンス長差」で誤検出
#     するため、アーキテクチャ上成立しない。SQL DB を導入した時点でこの行を
#     削除して再評価すること。
40018	IGNORE	(SQL Injection — DynamoDB only, no SQL is ever built)

#   40025  Proxy Disclosure
#     CloudFront 経由であることは x-amz-cf-id / via ヘッダで公開済みで隠蔽不能。
#     構成上の事実であり修正対象にならない。
40025	IGNORE	(Proxy Disclosure — CloudFront presence is public by design)

#   100001 Unexpected Content-Type
#     主に外部ドメイン（Cognito Hosted UI 等）を辿った先の警告。当方由来は
#     Next.js のエラーハンドラが HTML を返すケースのみで、JSON 強制は
#     フレームワーク挙動との乖離を生む。ノイズが多いため初回から IGNORE。
100001	IGNORE	(Unexpected Content-Type — mostly third-party domains, low signal)

#   10098  Cross-Domain Misconfiguration
#     公開 API (/api/v1/**) が `Access-Control-Allow-Origin: *` を返すことへの指摘。
#     しかし公開 API は **任意の利用者サイトに embed.js / render を埋め込む** ことが
#     仕様であり、ワイルドカード CORS は意図した設計。返すのは published な
#     コンテンツのみで、Cookie も送らない（`*` では credentials は送信されない）。
#     ⚠️ 再評価条件: /api/v1 配下に「非公開データ」を返すエンドポイントを追加した時点で
#        この IGNORE を外し、オリジン制限を検討すること。
10098	IGNORE	(CORS wildcard is intentional for embeddable public API; no credentials)
